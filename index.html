<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dylan Dog Collection iOS</title>
    <!-- Meta per iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="DylanDog Collection">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
        }
    </style>

<body class="pb-24">

    <!-- Header -->
    <header class="bg-red-950 text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center border-b border-red-900/40">
        <h1 class="text-base font-bold tracking-wider flex items-center gap-2">
            <i class="fa-solid fa-skull text-red-500"></i> Dylan Dog (1 - 460)
        </h1>
        <button onclick="openAddModal()" class="bg-red-700 hover:bg-red-600 text-white font-bold px-3 py-1.5 rounded-full text-xs shadow active:scale-95 transition flex items-center gap-1">
            <i class="fa-solid fa-plus"></i> Nuovo
        </button>
    </header>

    <!-- Barra di Ricerca e Filtri -->
    <div class="p-4 bg-zinc-900 border-b border-zinc-800 space-y-3 sticky top-[57px] z-40">
        <div class="flex gap-2">
            <div class="relative flex-grow">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-zinc-500 text-sm"></i>
                <input type="text" id="searchInput" oninput="renderCollection()" placeholder="Cerca per numero o titolo..." class="w-full bg-zinc-800 border border-zinc-700 rounded-lg pl-9 pr-3 py-2 text-sm text-white outline-none focus:border-red-600">
            </div>
            <select id="filterStatus" onchange="renderCollection()" class="bg-zinc-800 text-zinc-200 border border-zinc-700 rounded-lg px-3 py-2 text-sm outline-none">
                <option value="all">Tutti</option>
                <option value="owned">Posseduti</option>
                <option value="wishlist">Mancanti</option>
            </select>
        </div>
        <div class="flex justify-between items-center text-xs text-zinc-400">
            <span id="counter">Caricamento...</span>
            <button onclick="resetData()" class="text-zinc-500 hover:text-zinc-300 underline">Ripristina Excel</button>
        </div>
    </div>

    <!-- Lista Albi -->
    <main id="comicList" class="p-4 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
        <!-- Generato dinamicamente -->
    </main>

    <!-- Modale Dettagli / Modifica Albo -->
    <div id="comicModal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
        <div class="bg-zinc-900 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl p-6 border border-zinc-800 max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center mb-4">
                <h2 id="modalTitle" class="text-lg font-bold text-white">Modifica Albo</h2>
                <button onclick="closeModal()" class="text-zinc-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>

            <form id="comicForm" onsubmit="saveComic(event)" class="space-y-4">
                <input type="hidden" id="comicId">
                
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Numero</label>
                        <input type="text" id="comicNumber" required class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600 text-center">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Mese / Anno Uscita</label>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="comicMonth" placeholder="Mese" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600 text-center">
                            <input type="text" id="comicYear" placeholder="Anno" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600 text-center">
                        </div>
                    </div>
                </div>

                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Titolo</label>
                    <input type="text" id="comicTitle" required placeholder="Titolo dell'albo" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Stato Possesso</label>
                        <select id="comicStatus" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600">
                            <option value="owned">Posseduto</option>
                            <option value="wishlist">Mancante (Wishlist)</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Edizione / Stampa</label>
                        <select id="comicEdition" class="w-full bg-zinc-800 border border-zinc-700 rounded-lg p-2.5 text-white outline-none focus:border-red-600">
                            <option value="Originale">Originale</option>
                            <option value="Ristampa">Ristampa</option>
                            <option value="Seconda ristampa">Seconda ristampa</option>
                            <option value="Altra ristampa">Altra ristampa</option>
                        </select>
                    </div>
                </div>

                <!-- Sezione Foto -->
                <div>
                    <label class="block text-xs uppercase tracking-wider text-zinc-400 mb-1">Foto Copertina / Albo</label>
                    <div class="flex items-center gap-4">
                        <input type="file" id="comicImageInput" accept="image/*" capture="environment" onchange="previewImage(event)" class="hidden">
                        <button type="button" onclick="document.getElementById('comicImageInput').click()" class="bg-zinc-800 border border-zinc-700 text-zinc-300 px-4 py-2 rounded-lg text-sm hover:bg-zinc-700 transition flex items-center gap-2">
                            <i class="fa-solid fa-camera"></i> Scatta / Carica Foto
                        </button>
                    </div>
                    <!-- Anteprima Foto -->
                    <div id="imagePreviewContainer" class="mt-3 hidden relative w-24 h-32 rounded-lg overflow-hidden border border-zinc-700">
                        <img id="imagePreview" src="" alt="Anteprima" class="w-full h-full object-cover">
                        <button type="button" onclick="removeImage()" class="absolute top-1 right-1 bg-red-600 text-white rounded-full w-5 h-5 flex items-center justify-center text-xs"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <input type="hidden" id="comicImageBase64">
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="submit" class="flex-grow bg-red-700 hover:bg-red-800 text-white font-bold py-3 rounded-lg transition active:scale-98">
                        Salva Modifiche
                    </button>
                    <button type="button" id="deleteBtn" onclick="deleteCustomComic()" class="hidden bg-zinc-800 hover:bg-zinc-700 text-red-400 px-4 py-3 rounded-lg transition">
                        <i class="fa-solid fa-trash"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>

        ];

        let comics = JSON.parse(localStorage.getItem('dylans_comics_v3')) || initialComics;
        let currentImageBase64 = "";

        function saveToStorage() {
            localStorage.setItem('dylans_comics_v3', JSON.stringify(comics));
        }

        function resetData() {
            if (confirm("Vuoi ripristinare i dati originali dal file Excel?")) {
                comics = JSON.parse(JSON.stringify(initialComics));
                saveToStorage();
                renderCollection();
            }
        }

        function toggleStatus(id) {
            const comic = comics.find(c => c.id === id);
            if (comic) {
                comic.status = comic.status === 'owned' ? 'wishlist' : 'owned';
                saveToStorage();
                renderCollection();
            }
        }

        function openEditModal(id) {
            document.getElementById('comicModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = "Modifica Albo";
            document.getElementById('deleteBtn').classList.remove('hidden');
            
            const comic = comics.find(c => c.id === id);
            document.getElementById('comicId').value = comic.id;
            document.getElementById('comicNumber').value = comic.number;
            document.getElementById('comicTitle').value = comic.title;
            document.getElementById('comicMonth').value = comic.month || "";
            document.getElementById('comicYear').value = comic.year || "";
            document.getElementById('comicStatus').value = comic.status;
            document.getElementById('comicEdition').value = comic.edition || "Originale";
            
            currentImageBase64 = comic.image || "";
            if (currentImageBase64) {
                document.getElementById('imagePreview').src = currentImageBase64;
                document.getElementById('imagePreviewContainer').classList.remove('hidden');
            } else {
                removeImage();
            }
        }

        function openAddModal() {
            document.getElementById('comicModal').classList.remove('hidden');
            document.getElementById('modalTitle').innerText = "Nuovo Albo";
            document.getElementById('deleteBtn').classList.add('hidden');
            document.getElementById('comicForm').reset();
            document.getElementById('comicId').value = "";
            document.getElementById('comicEdition').value = "Originale";
            removeImage();
        }

        function closeModal() {
            document.getElementById('comicModal').classList.add('hidden');
        }

        function previewImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = new Image();
                    img.src = e.target.result;
                    img.onload = function() {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 400;
                        const scaleSize = MAX_WIDTH / img.width;
                        canvas.width = MAX_WIDTH;
                        canvas.height = img.height * scaleSize;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                        currentImageBase64 = canvas.toDataURL('image/jpeg', 0.7);
                        
                        document.getElementById('imagePreview').src = currentImageBase64;
                        document.getElementById('imagePreviewContainer').classList.remove('hidden');
                    }
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            currentImageBase64 = "";
            document.getElementById('comicImageInput').value = "";
            document.getElementById('imagePreview').src = "";
            document.getElementById('imagePreviewContainer').classList.add('hidden');
        }

        function saveComic(e) {
            e.preventDefault();
            const id = document.getElementById('comicId').value;
            const number = document.getElementById('comicNumber').value;
            const title = document.getElementById('comicTitle').value;
            const month = document.getElementById('comicMonth').value;
            const year = document.getElementById('comicYear').value;
            const status = document.getElementById('comicStatus').value;
            const edition = document.getElementById('comicEdition').value;

            if (id) {
                const index = comics.findIndex(c => c.id == id);
                if (index !== -1) {
                    comics[index] = { id: Number(id), number, title, month, year, status, edition, image: currentImageBase64 };
                }
            } else {
                const newComic = {
                    id: Date.now(),
                    number,
                    title,
                    month,
                    year,
                    status,
                    edition,
                    image: currentImageBase64
                };
                comics.push(newComic);
            }

            saveToStorage();
            renderCollection();
            closeModal();
        }

        function deleteCustomComic() {
            const id = Number(document.getElementById('comicId').value);
            if (confirm("Vuoi davvero eliminare questo albo dalla lista?")) {
                comics = comics.filter(c => c.id !== id);
                saveToStorage();
                renderCollection();
                closeModal();
            }
        }

        function renderCollection() {
            const listContainer = document.getElementById('comicList');
            const filter = document.getElementById('filterStatus').value;
            const searchQuery = document.getElementById('searchInput').value.toLowerCase();
            
            let filtered = comics.filter(c => {
                const matchesFilter = (filter === 'all' || c.status === filter);
                const matchesSearch = c.title.toLowerCase().includes(searchQuery) || c.number.toString().toLowerCase().includes(searchQuery);
                return matchesFilter && matchesSearch;
            });

            const ownedCount = comics.filter(c => c.status === 'owned').length;
            document.getElementById('counter').innerText = `Posseduti: ${ownedCount} su ${comics.length} albi`;

            if (filtered.length === 0) {
                listContainer.innerHTML = `
                    <div class="col-span-full text-center py-12 text-zinc-500">
                        <i class="fa-solid fa-book-open text-4xl mb-2"></i>
                        <p>Nessun albo trovato.</p>
                    </div>`;
                return;
            }

            listContainer.innerHTML = filtered.map(comic => `
                <div class="bg-zinc-900 border border-zinc-800 rounded-xl p-3 flex gap-3 items-center shadow-sm relative">
                    <!-- Foto Albo -->
                    <div onclick="openEditModal(${comic.id})" class="w-16 h-22 flex-shrink-0 bg-zinc-800 rounded-lg overflow-hidden flex items-center justify-center border border-zinc-700 cursor-pointer relative group">
                        ${comic.image ? `<img src="${comic.image}" class="w-full h-full object-cover">` : `<i class="fa-solid fa-camera text-zinc-600 text-lg"></i>`}
                        <div class="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition flex items-center justify-center">
                            <i class="fa-solid fa-pen text-white text-xs"></i>
                        </div>
                    </div>
                    
                    <!-- Info Albo -->
                    <div class="flex-grow min-w-0">
                        <div class="flex justify-between items-center mb-1">
                            <button onclick="toggleStatus(${comic.id})" class="text-xs font-semibold px-2 py-0.5 rounded transition ${comic.status === 'owned' ? 'bg-emerald-950 text-emerald-400 border border-emerald-800 hover:bg-emerald-900' : 'bg-amber-950 text-amber-400 border border-amber-800 hover:bg-amber-900'}">
                                <i class="fa-solid ${comic.status === 'owned' ? 'fa-check' : 'fa-clock'} mr-1"></i> ${comic.status === 'owned' ? 'Posseduto' : 'Mancante'}
                            </button>
                            <span class="text-xs text-zinc-400 bg-zinc-800 px-2 py-0.5 rounded border border-zinc-700">
                                ${comic.edition || 'Originale'}
                            </span>
                        </div>
                        <h3 onclick="openEditModal(${comic.id})" class="text-white font-bold text-sm truncate cursor-pointer hover:text-red-400 transition">
                            N. ${comic.number} - ${comic.title}
                        </h3>
                        <p class="text-xs text-zinc-400 mt-1 flex items-center gap-2">
                            <span><i class="fa-regular fa-calendar mr-1"></i> ${comic.month ? comic.month + '/' : ''}${comic.year || 'N/D'}</span>
                        </p>
                    </div>
                </div>
            `).join('');
        }

        renderCollection();
    </script>
